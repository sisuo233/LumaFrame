name: Build LumaFrame Android Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build test APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            cmake \
            git \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3-pip \
            python3-venv \
            rsync \
            unzip \
            zip \
            zlib1g-dev
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython virtualenv python-for-android==2026.5.9

      - name: Build test APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/build_apk.sh

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumaframe-test-apk
          path: bin/*.apk
          if-no-files-found: error
